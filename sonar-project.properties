# SonarQube Cloud analysis of the web app. The organization and project key come from the SONAR_ORGANIZATION and
# SONAR_PROJECT_KEY repository variables (see .github/workflows/deploy.yml).
sonar.projectName=ROAM AI web app
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,e2e/**/*.ts
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.tsx,src/vite-env.d.ts
